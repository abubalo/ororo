# .github/workflows/deploy.yml
# Continuous Deployment - Deploy to Cloudflare Workers on merge to main/develop

name: Deploy

on:
  push:
    branches:
      - main        # Production
      - develop     # Staging
  workflow_dispatch:  # Manual deployment

jobs:
  # Deploy API to Cloudflare Workers
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    
    # Deployment environment based on branch
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://api.ororo.app' || 'https://api-staging.ororo.app' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: apps/api
        run: bun run type-check

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy ${{ github.ref == 'refs/heads/main' && '' || '--env staging' }}
          secrets: |
            JWT_SECRET
            MTN_MOMO_API_KEY
            AIRTEL_MONEY_API_KEY
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MTN_MOMO_API_KEY: ${{ secrets.MTN_MOMO_API_KEY }}
          AIRTEL_MONEY_API_KEY: ${{ secrets.AIRTEL_MONEY_API_KEY }}

      - name: Run migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/db
          command: d1 migrations apply ${{ github.ref == 'refs/heads/main' && 'ororo-production' || 'ororo-staging' }} --remote

      - name: Deployment summary
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "🚀 Deployed to PRODUCTION: https://api.ororo.app"
          else
            echo "🚀 Deployed to STAGING: https://api-staging.ororo.app"
          fi

      - name: Notify deployment
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi

  # Health check after deployment
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy-api
    
    steps:
      - name: Wait for deployment
        run: sleep 10

      - name: Check API health
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            URL="https://api.ororo.app/health"
          else
            URL="https://api-staging.ororo.app/health"
          fi
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $URL)
          
          if [[ $RESPONSE == "200" ]]; then
            echo "✅ Health check passed: $URL"
            exit 0
          else
            echo "❌ Health check failed: $URL (HTTP $RESPONSE)"
            exit 1
          fi

  # Create GitHub release on production deployment
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy-api, health-check]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d')-${GITHUB_SHA::7}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release v${{ steps.version.outputs.version }}
          body: |
            ## Deployment
            - **Environment**: Production
            - **API**: https://api.ororo.app
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref }}
            
            ## Changes
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false